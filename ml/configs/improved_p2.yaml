# Justified improvement for SMALL / FAINT objects: YOLOv8n with an extra P2
# (stride-4) detection head. Standard YOLOv8 predicts from strides 8/16/32,
# so objects a few pixels wide fall below the finest feature-map resolution.
# The P2 head quadruples the resolution of the finest level at ~1.5x compute.
# Compare against baseline.yaml on the SAME test split (same seed and data).
name: improved-p2-streaks
model: yolov8n-p2.yaml     # architecture file bundled with Ultralytics
pretrained: yolov8n.pt     # transfer compatible backbone weights
data: ml/data/streaks/data.yaml
epochs: 50
imgsz: 640
batch: 16
seed: 42
device: cpu
workers: 2
optimizer: auto
lr0: 0.01
patience: 15
mosaic: 1.0
fliplr: 0.5
flipud: 0.5
degrees: 0.0
scale: 0.5
